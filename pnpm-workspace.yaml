packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  "@swc/core": true
  esbuild: true
  sharp: true
  embedded-postgres: true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/linux-arm64": true
  unrs-resolver: true
  "@nestjs/core": false
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - "@nestjs/common@11.2.8"
  - "@nestjs/core@11.2.8"
  - "@nestjs/platform-express@11.2.8"
  - "@nestjs/testing@11.2.8"
